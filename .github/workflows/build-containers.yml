# Build amgix-now images (CPU + GPU) and push to Docker Hub.
# Repo secrets required: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
name: Build containers

on:
  push:
    tags: ['v*']

jobs:
  # require-tests-passed:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Require successful Test workflow for this commit
  #       uses: actions/github-script@v8
  #       with:
  #         script: |
  #           const sha = context.sha;
  #           const { data } = await github.rest.actions.listWorkflowRunsForRepo({
  #             owner: context.repo.owner,
  #             repo: context.repo.repo,
  #             head_sha: sha,
  #             status: 'completed',
  #             per_page: 50
  #           });
  #           const testRun = data.workflow_runs.find(
  #             (r) => r.name === 'Run Tests' && r.conclusion === 'success'
  #           );
  #           if (!testRun) {
  #             throw new Error(
  #               'No successful Run Tests workflow found for this commit. Run Tests on main must pass before building containers for a tag.'
  #             );
  #           }

  signal-vm:
    # needs: require-tests-passed
    uses: ./.github/workflows/signal-vm.yml
    secrets: inherit

  build-now-cpu:
    needs: signal-vm
    runs-on: ubuntu-x1
    permissions:
      contents: read

    steps:
      - name: Fix workspace permissions via Docker
        run: docker run --rm -v ${{ github.workspace }}:/work alpine sh -c "chown -R $(id -u):$(id -g) /work || true"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set version
        run: |
          if [ "${{ github.ref_type }}" != "tag" ] || [[ ! "${{ github.ref_name }}" =~ ^v ]]; then
            echo "This workflow only runs on tags starting with v (e.g. v1.0.0). Ref: ${{ github.ref }}"
            exit 1
          fi
          REF="${{ github.ref_name }}"
          VERSION_NO_V="${REF#v}"
          echo "VERSION=$REF" >> $GITHUB_ENV
          echo "AMGIX_VERSION=$VERSION_NO_V" >> $GITHUB_ENV
          echo "SHORT_MAJOR=$(echo "$VERSION_NO_V" | cut -d. -f1)" >> $GITHUB_ENV
          echo "SHORT_MINOR=$(echo "$VERSION_NO_V" | cut -d. -f1-2)" >> $GITHUB_ENV
          echo "Image tag: $REF, build-arg AMGIX_VERSION=$VERSION_NO_V"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amgix-now (CPU)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile.cpu
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/amgix-now:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/amgix-now:${{ env.SHORT_MINOR }}
            ${{ secrets.DOCKERHUB_USERNAME }}/amgix-now:${{ env.SHORT_MAJOR }}
          build-args: |
            AMGIX_VERSION=${{ env.AMGIX_VERSION }}

  build-now-gpu:
    needs: build-now-cpu
    runs-on: ubuntu-x1
    permissions:
      contents: read

    steps:
      - name: Fix workspace permissions via Docker
        run: docker run --rm -v ${{ github.workspace }}:/work alpine sh -c "chown -R $(id -u):$(id -g) /work || true"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set version
        run: |
          if [ "${{ github.ref_type }}" != "tag" ] || [[ ! "${{ github.ref_name }}" =~ ^v ]]; then
            echo "This workflow only runs on tags starting with v (e.g. v1.0.0). Ref: ${{ github.ref }}"
            exit 1
          fi
          REF="${{ github.ref_name }}"
          VERSION_NO_V="${REF#v}"
          echo "VERSION=$REF" >> $GITHUB_ENV
          echo "AMGIX_VERSION=$VERSION_NO_V" >> $GITHUB_ENV
          echo "SHORT_MAJOR=$(echo "$VERSION_NO_V" | cut -d. -f1)" >> $GITHUB_ENV
          echo "SHORT_MINOR=$(echo "$VERSION_NO_V" | cut -d. -f1-2)" >> $GITHUB_ENV
          echo "Image tag: $REF, build-arg AMGIX_VERSION=$VERSION_NO_V"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amgix-now (GPU)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile.gpu
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/amgix-now:${{ env.VERSION }}-gpu
            ${{ secrets.DOCKERHUB_USERNAME }}/amgix-now:${{ env.SHORT_MINOR }}-gpu
            ${{ secrets.DOCKERHUB_USERNAME }}/amgix-now:${{ env.SHORT_MAJOR }}-gpu
          build-args: |
            AMGIX_VERSION=${{ env.AMGIX_VERSION }}

  create-release:
    needs: build-now-gpu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true

  clear-vm-request:
    needs: build-now-gpu
    if: always()
    uses: ./.github/workflows/clear-vm-request.yml
    secrets: inherit
