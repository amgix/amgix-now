# Supervisord: embedded Qdrant + amgix-now API

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:qdrant]
command=/app/prefix-log-exec.sh "qdrant" /usr/local/bin/qdrant --config-path /app/config.yaml
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=1
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true

[program:amgix-now]
command=/app/prefix-log-exec.sh "amgix-now" /app/amgix-now
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
