[package]
name = "amgix-now"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
murmurhash3 = "0.0.5"
once_cell = "1.21.4"
rust-stemmers = "1.2.0"
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
stopwords = "0.1.1"
tokio = { version = "1.52.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
unicode-segmentation = "1.13.2"
uuid = { version = "1.23.1", features = ["v4", "v5"] }
qdrant-client = "1.17.0"
