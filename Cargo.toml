[package]
name = "amgix-now"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
murmurhash3 = "0.0.5"
once_cell = "1.19"
rust-stemmers = "1.2"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stopwords = "0.1"
tokio = { version = "1", features = ["full"] }
unicode-segmentation = "1.12"
uuid = { version = "1", features = ["v4", "v5"] }
qdrant-client = "1"
prost-types = "0.13"
